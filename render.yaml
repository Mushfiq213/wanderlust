services:
  - type: web
    name: wanderlust
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps
    startCommand: node app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ATLAS_DB_URL
        sync: false
      - key: SECRET
        generateValue: true
      - key: CLOUD_NAME
        sync: false
      - key: CLOUD_API_KEY
        sync: false
      - key: CLOUD_API_SECRET
        sync: false
